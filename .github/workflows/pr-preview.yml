name: PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

jobs:
  pr-preview:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Install pinned npm for dependency policy
        run: npm install --global --ignore-scripts npm@11.20.0 --registry=https://registry.npmjs.org/

      - name: Build preview
        if: github.event.action != 'closed'
        env:
          PR_PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
          BASE_URL: /pr-preview/a2a-editor/pr-${{ github.event.pull_request.number }}/
          VITE_PREDEFINED_AGENTS: ${{ secrets.VITE_PREDEFINED_AGENTS }}
        run: |
          set -euo pipefail
          npm ci
          npm run build:standalone
          mkdir -p website/static/standalone
          cp dist-standalone/a2a-playground.js website/static/standalone/
          cp dist-standalone/a2a-playground.css website/static/standalone/
          cd website
          npm ci
          npm run build

      - name: PR preview
        uses: open-resource-discovery/pr-preview-action@245fafc76cbc9b14ca2b6a2b61b9ca64b1d89c98 # main; shared action PR #30
        with:
          fork: false
          target-repo: open-resource-discovery/pr-preview
          pages-base-url: https://open-resource-discovery.github.io/pr-preview
          umbrella-dir: a2a-editor
          token: ${{ secrets.PR_PREVIEW_TOKEN }}
          build-dir: website/build
          wait-poll-attempts: 180
    if: github.event.pull_request.head.repo.full_name == github.repository
