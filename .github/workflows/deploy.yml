name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "26"
      - name: Install pinned npm for dependency policy
        run: npm install --global --ignore-scripts npm@11.20.0 --registry=https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build standalone bundle
        run: npm run build:standalone
        env:
          NODE_ENV: production
          VITE_PREDEFINED_AGENTS: ${{ secrets.VITE_PREDEFINED_AGENTS }}

      - name: Copy standalone assets to website
        run: |
          mkdir -p website/static/standalone
          cp dist-standalone/a2a-playground.js website/static/standalone/
          cp dist-standalone/a2a-playground.css website/static/standalone/

      - name: Install website dependencies
        run: cd website && npm ci

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build Docusaurus website
        run: cd website && npm run build
        env:
          NODE_ENV: production
          BASE_URL: /a2a-editor/
          VITE_PREDEFINED_AGENTS: ${{ secrets.VITE_PREDEFINED_AGENTS }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

    permissions:
      contents: read
      pages: read
    if: github.ref == 'refs/heads/main'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.ref == 'refs/heads/main'
